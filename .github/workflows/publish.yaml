name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v*'
  # Started by netbox-latest.yml for the tag it pushed: a tag pushed with
  # GITHUB_TOKEN does not trigger the push event above
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version strings match
    runs-on: ubuntu-latest
    steps:
      - name: Only release tags are published
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow for a release tag (v*), not for ${GITHUB_REF}" >&2
          exit 1
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check versions
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/version-check.py "$TAG"

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to PyPI
    # Nothing is published unless the versions match, the lint is clean and all tests pass
    needs: [validate, lint, test]
    if: github.repository == 'Maksym-Ototiuk/netbox-device-type-sync'
    runs-on: ubuntu-latest
    # must match the environment name in the PyPI trusted publisher settings
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'build[virtualenv]'
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  create-release:
    name: Create GitHub Release
    needs: publish
    if: github.repository == 'Maksym-Ototiuk/netbox-device-type-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Publish the release with its CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
