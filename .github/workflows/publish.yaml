name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate version strings match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check versions
        run: python scripts/version-check.py "${{ github.ref_name }}"

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to PyPI
    # Nothing is published unless the versions match, the lint is clean and all tests pass
    needs: [validate, lint, test]
    if: github.repository == 'Maksym-Ototiuk/netbox-device-type-sync'
    runs-on: ubuntu-latest
    # must match the environment name in the PyPI trusted publisher settings
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'build[virtualenv]'
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  create-release:
    name: Create GitHub Release
    needs: publish
    if: github.repository == 'Maksym-Ototiuk/netbox-device-type-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft
