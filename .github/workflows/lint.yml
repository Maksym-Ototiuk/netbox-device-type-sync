name: Lint

on:
  push:
    # Branches only: a release tag runs the lint through publish.yaml
    branches:
      - '**'
  pull_request:
  # Called by publish.yaml before a release is published
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: 0.15.22
          src: "./netbox_device_type_sync"
